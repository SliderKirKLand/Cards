<style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;background:#efefef;color:#111}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #777;outline-offset:3px}.shell{width:min(1080px,calc(100% - 32px));margin:36px auto 70px}.top{text-align:center;margin-bottom:26px}.top h1{font-size:clamp(29px,5vw,52px);letter-spacing:-.055em;margin:0 0 6px;font-weight:900}.top p{font-size:12px;letter-spacing:.19em;font-weight:700;margin:0;color:#555}.stage{border:1px solid #d1d1d1;background:#f8f8f8;border-radius:15px;padding:clamp(16px,3vw,32px);min-height:500px}.pack-area{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:23px;padding:14px 0 20px}.pack{position:relative;overflow:hidden;width:246px;height:337px;background:#101010;color:white;border:2px solid #000;border-radius:9px;box-shadow:12px 14px 0 #d6d6d6;display:flex;flex-direction:column;justify-content:space-between;padding:19px;text-align:left;cursor:pointer;transition:transform .2s}.pack:hover{transform:rotate(-2deg) translateY(-4px)}.tear{border-top:2px dashed white;padding-top:9px;font-size:10px;letter-spacing:.08em}.pack-title{font-size:31px;font-weight:900;line-height:1.03;letter-spacing:-.05em}.pack-sub{font-size:13px;font-weight:600;margin-top:12px;line-height:1.4}.pack-bottom{border-top:1px solid #777;padding-top:12px;font-weight:700;font-size:12px;line-height:1.8}.btn{border:2px solid #111;background:#111;color:white;padding:14px 23px;border-radius:6px;font-weight:800;letter-spacing:.02em}.btn:hover{background:#333}.btn.secondary{background:white;color:#111}.btn.secondary:hover{background:#e5e5e5}.hint{color:#666;font-size:12px;text-align:center;max-width:350px;line-height:1.5}.hidden{display:none!important}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.bar .eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em}.bar .btn{padding:10px 15px;font-size:13px}.black{background:#101010;color:white;min-height:200px;padding:23px;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between}.black .eyebrow{font-size:11px;letter-spacing:.12em;color:#bbb;font-weight:800}.black .prompt{font-size:clamp(22px,3.2vw,33px);line-height:1.15;font-weight:900;max-width:750px;margin:26px 0}.black footer{font-size:10px;font-weight:800;color:#ccc;display:flex;justify-content:space-between}.heading{font-size:12px;letter-spacing:.1em;margin:22px 0 12px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.answer{min-height:177px;padding:13px;background:#fff;color:#111;border:2px solid #cfcfcf;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .16s,border-color .16s,box-shadow .16s}.answer:hover{transform:translateY(-4px);border-color:#777}.answer.selected{border:3px solid #111;box-shadow:5px 5px 0 #ccc}.answer .number,.answer footer{color:#666;font-size:10px;letter-spacing:.04em}.answer strong{font-size:16px;line-height:1.25}.result{margin-top:22px;padding:22px;border:2px solid #111;background:white;border-radius:7px}.result .eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#555}.result h2{font-size:clamp(20px,3vw,28px);line-height:1.24;margin:13px 0 20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.timer{margin-top:20px;text-align:center;border:1px solid #ccc;background:white;border-radius:7px;padding:22px}.timer-label{font-size:12px;font-weight:800;letter-spacing:.1em}.clock{font-size:clamp(45px,8vw,74px);font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:10px 0}.progress{height:9px;border-radius:99px;background:#ddd;overflow:hidden;margin:15px auto 21px;max-width:600px}.progress>div{height:100%;background:#111;width:100%;transition:width .25s linear}.timer .actions{justify-content:center}.foot{text-align:center;color:#666;margin:20px 0;font-size:11px;font-weight:800;letter-spacing:.14em}/* Shuffleable monochrome card deck */
.deck-stage{width:290px;height:365px;position:relative;display:grid;place-items:center;perspective:850px;cursor:pointer;border:0;background:transparent;padding:0;isolation:isolate}
.deck-card{position:absolute;top:15px;left:24px;width:242px;height:326px;border:2px solid #111;border-radius:11px;background:#fff;box-shadow:0 8px 18px #0002;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:20px;pointer-events:none;transform-origin:center bottom}
.deck-card:nth-child(1){background:#111;color:#fff;transform:translate(-13px,10px) rotate(-8deg)}
.deck-card:nth-child(2){transform:translate(12px,5px) rotate(7deg)}
.deck-card:nth-child(3){background:#111;color:#fff;transform:translate(-4px,-2px) rotate(-3deg)}
.deck-card:nth-child(4){transform:translate(6px,-9px) rotate(3deg)}
.deck-card:nth-child(5){background:#fff;color:#111;transform:translate(0,-15px) rotate(0deg)}
.deck-card .deck-kicker{font-size:11px;font-weight:800;letter-spacing:.12em}
.deck-card .deck-title{font-size:30px;font-weight:900;letter-spacing:-.055em;line-height:1.06}
.deck-card .deck-bottom{font-size:11px;font-weight:800}
.deck-stage:hover:not(.shuffling) .deck-card:last-child{transform:translateY(-23px)}
.deck-stage.shuffling .deck-card:nth-child(1){animation:shuffle-left 1.28s cubic-bezier(.4,0,.2,1) both}
.deck-stage.shuffling .deck-card:nth-child(2){animation:shuffle-right 1.28s cubic-bezier(.4,0,.2,1) .07s both}
.deck-stage.shuffling .deck-card:nth-child(3){animation:shuffle-left 1.28s cubic-bezier(.4,0,.2,1) .14s both}
.deck-stage.shuffling .deck-card:nth-child(4){animation:shuffle-right 1.28s cubic-bezier(.4,0,.2,1) .21s both}
.deck-stage.shuffling .deck-card:nth-child(5){animation:shuffle-center 1.28s ease-in-out .05s both}
@keyframes shuffle-left{0%{transform:translate(-13px,10px) rotate(-8deg)}32%{transform:translate(-100px,-35px) rotate(-23deg)}65%{transform:translate(85px,-55px) rotate(17deg)}100%{transform:translate(0,-15px) rotate(0)}}
@keyframes shuffle-right{0%{transform:translate(12px,5px) rotate(7deg)}32%{transform:translate(105px,-35px) rotate(23deg)}65%{transform:translate(-80px,-55px) rotate(-16deg)}100%{transform:translate(0,-15px) rotate(0)}}
@keyframes shuffle-center{0%{transform:translate(0,-15px) rotate(0)}30%{transform:translate(0,-90px) rotate(7deg)}65%{transform:translate(0,15px) rotate(-7deg)}100%{transform:translate(0,-15px) rotate(0)}}
.game-reveal{animation:deal-in .35s ease-out both}@keyframes deal-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:850px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.answer{min-height:148px}.stage{padding:14px}.black{min-height:180px}.answer strong{font-size:15px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* playing cards based on the CAH */
:root{--card-width:248px;--card-height:350px}
.shell{width:min(1200px,calc(100% - 28px))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;align-items:start}
.black,.answer{width:100%;max-width:var(--card-width);height:var(--card-height);min-height:var(--card-height);border-radius:13px;padding:24px 21px 20px;box-shadow:0 3px 9px #00000012;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:0;text-align:left}
.black{background:#050505;color:white;border:2px solid #050505;margin:0 0 20px}
.black .eyebrow{display:none}
.black .prompt{font-size:clamp(20px,2.1vw,26px);line-height:1.16;font-weight:900;letter-spacing:-.025em;margin:0;max-width:none;min-height:0;flex:1;overflow-y:auto;overflow-wrap:break-word;scrollbar-width:thin}
.black footer{font-size:10px;color:#e9e9e9;font-weight:700;letter-spacing:.01em;flex-shrink:0;padding-top:16px}
.black footer span::before{content:'▣  ';font-size:15px;vertical-align:-1px}
.black footer span{font-size:0}
.black footer span::after{content:'BLACK CARD';font-size:10px}
.answer{border:2px solid #ddd;background:#fff;color:#0b0b0b;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.answer strong{font-size:clamp(20px,2vw,26px);line-height:1.16;letter-spacing:-.025em;font-weight:900;display:block;overflow-y:auto;overflow-wrap:break-word;min-height:0;flex:1;scrollbar-width:thin}
.answer .number{display:none}
.answer footer{display:block;font-size:10px;color:#666;letter-spacing:.01em;font-weight:700;flex-shrink:0;padding-top:16px}
.answer footer::before{content:'▣  ';font-size:15px;vertical-align:-1px}
.answer:hover{transform:translateY(-7px);border-color:#777}
.answer.selected{border:3px solid #111;box-shadow:7px 7px 0 #c6c6c6}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.black,.answer{width:100%;height:auto;min-height:0;aspect-ratio:5/7;padding:clamp(12px,3vw,21px);border-radius:11px}.black{max-width:calc((100% - 12px)/2)}.black .prompt,.answer strong{font-size:clamp(15px,3.3vw,23px)}.black footer,.answer footer{padding-top:8px;font-size:9px}}
@media(min-width:701px) and (max-width:950px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Full stack shuffle with staggered alternating splits. */
.deck-stage{width:340px;height:410px;perspective:1000px;overflow:visible}
.deck-stage .deck-card{top:17px;left:44px;width:248px;height:350px;border-radius:13px;transform-origin:50% 85%;box-sizing:border-box}
.deck-stage .deck-layer{padding:0;background:#fff;box-shadow:0 1px 1px #0003;transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px)) rotate(calc((var(--i) - 16)*.12deg));z-index:calc(var(--i) + 1)}
.deck-stage .deck-layer.dark{background:#101010;border-color:#101010}
.deck-stage .deck-face{background:#111;color:white;transform:translate(0,-24px) rotate(-1deg);z-index:40;padding:25px;box-shadow:0 9px 20px #0003}
.deck-stage:hover:not(.shuffling) .deck-face{transform:translate(0,-34px) rotate(-2deg)}
.deck-stage.shuffling .deck-layer{animation:full-stack-shuffle 1.55s ease-in-out both;animation-delay:calc(var(--i)*12ms)}
.deck-stage.shuffling .deck-face{animation:face-stack-shuffle 1.55s ease-in-out both}
@keyframes full-stack-shuffle{
  0%{transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px)) rotate(0)}
  24%{transform:translate(calc(var(--side)*75px),calc(-56px + var(--i)*.8px)) rotate(calc(var(--side)*13deg))}
  48%{transform:translate(calc(var(--side)*112px),calc(-28px + var(--i)*.6px)) rotate(calc(var(--side)*19deg))}
  72%{transform:translate(calc(var(--side)*-38px),calc(-12px + var(--i)*.6px)) rotate(calc(var(--side)*-7deg))}
  100%{transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px)) rotate(calc((var(--i) - 16)*.12deg))}
}
@keyframes face-stack-shuffle{
  0%,100%{transform:translate(0,-24px) rotate(-1deg)}
  25%{transform:translate(-78px,-80px) rotate(-15deg)}
  50%{transform:translate(90px,-100px) rotate(16deg)}
  75%{transform:translate(10px,-49px) rotate(4deg)}
}
@media(max-width:420px){.deck-stage{transform:scale(.83);margin:-28px 0}}

/* Angled tabletop viewpoint. The cards lie flat on the table and shuffle in its plane. */
.deck-stage{width:440px;height:335px;perspective:950px;perspective-origin:50% 38%;align-items:center;justify-items:center}
.deck-table{position:relative;display:block;width:340px;height:410px;transform-style:preserve-3d;transform:rotateX(61deg) rotateZ(-13deg) translateY(-18px);filter:drop-shadow(16px 33px 16px #0003);pointer-events:none}
.deck-table .deck-card{backface-visibility:hidden}
.deck-stage:hover:not(.shuffling) .deck-face{transform:translate(0,-31px) rotate(-2deg)}
@media(max-width:520px){.deck-stage{width:100%;height:295px;perspective:800px}.deck-table{transform:scale(.79) rotateX(61deg) rotateZ(-13deg) translateY(-18px)} }
@media(max-width:420px){.deck-stage{transform:none;margin:0}}

/* Full-deck tabletop riffle: interleave, cascade down, then drop and settle. */
.deck-stage{height:345px;perspective:1150px}
.deck-table{transform:rotateX(59deg) rotateZ(-10deg) translateY(-10px);transform-style:preserve-3d}
.deck-stage .deck-layer{transform-origin:50% 87%;backface-visibility:visible;will-change:transform}
.deck-stage.shuffling .deck-table{animation:deck-drop 3.45s ease-in-out both}
.deck-stage.shuffling .deck-layer{animation:riffle-cascade 3.3s cubic-bezier(.45,.05,.35,1) both;animation-delay:calc(var(--i)*4ms)}
.deck-stage.shuffling .deck-face{animation:riffle-top-cascade 3.3s ease-in-out both}
@keyframes riffle-cascade{
  0%{transform:translate3d(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px),0) rotateZ(0deg)}
  15%{transform:translate3d(calc(var(--side)*104px),calc(-15px + var(--i)*.7px),calc(var(--i)*.2px)) rotateZ(calc(var(--side)*-9deg))}
  33%{transform:translate3d(calc(var(--side)*96px),calc(-15px + var(--i)*.7px),calc(15px + var(--i)*.35px)) rotateZ(calc(var(--side)*-6deg)) rotateY(calc(var(--side)*-36deg)) rotateX(-12deg)}
  49%{transform:translate3d(calc(var(--side)*54px),calc(-11px + var(--i)*.45px),calc(23px - var(--i)*.3px)) rotateZ(calc(var(--side)*-3deg)) rotateY(calc(var(--side)*-48deg)) rotateX(-16deg)}
  61%{transform:translate3d(calc(var(--side)*7px),calc(-10px + var(--i)*.46px),calc(25px + var(--i)*.35px)) rotateZ(calc(var(--side)*1deg)) rotateY(calc(var(--side)*-12deg))}
  72%{transform:translate3d(calc(var(--side)*1px),calc(-18px + var(--i)*.4px),calc(19px + (32 - var(--i))*.65px)) rotateX(-7deg)}
  83%{transform:translate3d(0,calc(14px + (32 - var(--i))*.65px),0) rotateX(0deg)}
  90%{transform:translate3d(0,calc(24px + (32 - var(--i))*.35px),-7px)}
  96%{transform:translate3d(0,calc((16 - var(--i))*1.3px - 4px),0)}
  100%{transform:translate3d(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px),0) rotateZ(calc((var(--i) - 16)*.12deg))}
}
@keyframes riffle-top-cascade{
  0%{transform:translate(0,-24px) rotateZ(-1deg)}
  15%{transform:translate(-104px,-30px) rotateZ(10deg)}
  33%{transform:translate(-96px,-33px) rotateZ(8deg) rotateY(34deg) rotateX(-10deg)}
  49%{transform:translate(-54px,-25px) rotateZ(4deg) rotateY(48deg) rotateX(-15deg)}
  61%{transform:translate(-7px,-22px) rotateZ(1deg) rotateY(10deg)}
  72%{transform:translate3d(0,-5px,20px) rotateX(-7deg)}
  83%{transform:translate3d(0,19px,0) rotateX(0)}
  90%{transform:translate3d(0,28px,-7px)}
  96%{transform:translate(0,-28px)}
  100%{transform:translate(0,-24px) rotateZ(-1deg)}
}
@keyframes deck-drop{
  0%,70%{transform:rotateX(59deg) rotateZ(-10deg) translateY(-10px)}
  81%{transform:rotateX(59deg) rotateZ(-10deg) translateY(-10px)}
  89%{transform:rotateX(59deg) rotateZ(-10deg) translateY(39px)}
  94%{transform:rotateX(59deg) rotateZ(-10deg) translateY(22px)}
  100%{transform:rotateX(59deg) rotateZ(-10deg) translateY(-10px)}
}
@media(max-width:520px){.deck-stage{height:295px}.deck-table{transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(-10px)}.deck-stage.shuffling .deck-table{animation-name:deck-drop-mobile}}
@keyframes deck-drop-mobile{
  0%,81%{transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(-10px)}
  89%{transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(39px)}
  94%{transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(22px)}
  100%{transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(-10px)}
}
@media(prefers-reduced-motion:reduce){.deck-stage.shuffling .deck-layer,.deck-stage.shuffling .deck-face,.deck-stage.shuffling .deck-table{animation-duration:.1s;animation-delay:0s}}

/* Simple full-deck drop shuffle. No bending, splitting, or riffle. */
.deck-stage.shuffling .deck-layer {
  animation: flat-card-drop 2.1s ease-in-out both;
  animation-delay: calc(var(--i) * 8ms);
}
.deck-stage.shuffling .deck-face {
  animation: flat-face-drop 2.1s ease-in-out both;
}
.deck-stage.shuffling .deck-table {
  animation: flat-deck-settle 2.35s ease-in-out both;
}
@keyframes flat-card-drop {
  0% {transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px)) rotate(calc((var(--i) - 16)*.12deg));}
  23% {transform:translate(calc((var(--i) - 16)*.6px),calc(-60px - var(--i)*1.6px)) rotate(calc((var(--i) - 16)*.22deg));}
  53% {transform:translate(calc((var(--i) - 16)*1.1px),calc(48px - var(--i)*.22px)) rotate(calc((var(--i) - 16)*.45deg));}
  72% {transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px + 12px)) rotate(calc((var(--i) - 16)*.12deg));}
  86% {transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px - 7px)) rotate(calc((var(--i) - 16)*.12deg));}
  100% {transform:translate(calc((var(--i) - 16)*.18px),calc((16 - var(--i))*1.3px)) rotate(calc((var(--i) - 16)*.12deg));}
}
@keyframes flat-face-drop {
  0%,100% {transform:translate(0,-24px) rotate(-1deg);}
  23% {transform:translate(0,-112px) rotate(-3deg);}
  53% {transform:translate(0,48px) rotate(2deg);}
  72% {transform:translate(0,-10px) rotate(-1deg);}
  86% {transform:translate(0,-32px) rotate(-1deg);}
}
@keyframes flat-deck-settle {
  0%,65%,100% {transform:rotateX(59deg) rotateZ(-10deg) translateY(-10px);}
  77% {transform:rotateX(59deg) rotateZ(-10deg) translateY(29px);}
  88% {transform:rotateX(59deg) rotateZ(-10deg) translateY(-18px);}
}
@media(max-width:520px) {
 .deck-stage.shuffling .deck-table {animation-name:flat-deck-settle-mobile;}
}
@keyframes flat-deck-settle-mobile {
  0%,65%,100% {transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(-10px);}
  77% {transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(29px);}
  88% {transform:scale(.79) rotateX(59deg) rotateZ(-10deg) translateY(-18px);}
}

/* Front-facing deck: remove the tabletop tilt while retaining the drop shuffle. */
.deck-stage {height:410px; perspective:none;}
.deck-table {transform:none; transform-style:flat; filter:drop-shadow(9px 13px 9px #0002);}
@keyframes flat-deck-settle {
  0%,65%,100% {transform:translateY(0);}
  77% {transform:translateY(34px);}
  88% {transform:translateY(-12px);}
}
@media (max-width:520px) {
  .deck-stage {height:345px;}
  .deck-table {transform:scale(.79);}
}
@keyframes flat-deck-settle-mobile {
  0%,65%,100% {transform:scale(.79) translateY(0);}
  77% {transform:scale(.79) translateY(34px);}
  88% {transform:scale(.79) translateY(-12px);}
}

/* Two rounds of staggered left-and-right pile shuffling. */
.deck-stage.shuffling .deck-layer {
  animation-name: side-pile-shuffle;
  animation-duration: 0.82s;
  animation-timing-function: cubic-bezier(.38,.06,.24,1);
  animation-delay: var(--delay);
  animation-iteration-count: 2;
  animation-fill-mode: both;
}
.deck-stage.shuffling .deck-face {
  animation: side-face-shuffle 0.82s cubic-bezier(.38,.06,.24,1) 2 both;
}
.deck-stage.shuffling .deck-table {animation: none;}
@keyframes side-pile-shuffle {
  0%,100% {transform:translateX(calc((var(--i) - 16)*.18px)) translateY(calc((16 - var(--i))*1.3px));}
  30%,52% {transform:translateX(calc(var(--side)*114px)) translateY(calc((16 - var(--i))*1.3px));}
  78% {transform:translateX(calc(var(--side)*12px)) translateY(calc((16 - var(--i))*1.3px));}
}
@keyframes side-face-shuffle {
  0%,100% {transform:translateX(0) translateY(-24px);}
  30%,52% {transform:translateX(114px) translateY(-24px);}
  78% {transform:translateX(12px) translateY(-24px);}
}
@media (prefers-reduced-motion:reduce) {
  .deck-stage.shuffling .deck-layer,.deck-stage.shuffling .deck-face {animation-duration:.01ms;animation-delay:0ms;}
}
